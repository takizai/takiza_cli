[package]
name = "takiza-harness"
version = "0.1.3"
edition = "2021"
description = "Autonomous AI Software Engineering Agent CLI"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ai", "agent", "cli", "coding-assistant", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "takiza"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
tokio-util = "0.7"
