[package]
name = "takiza-harness"
version = "0.1.12"
edition = "2021"
description = "Autonomous AI Software Engineering Agent CLI"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ai", "agent", "cli", "coding-assistant", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "takiza"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
semver = "1"
self-replace = "1.5"
tempfile = "3"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dotenvy = "0.15"
anyhow = "1.0"
regex = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
chrono = "0.4"
tokio-util = "0.7"

scraper = { version = "0.27", default-features = false }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }
jsonschema = { version = "0.33", default-features = false }
async-trait = "0.1"
mcp-reqwest = { version = "0.13", package = "reqwest", default-features = false, features = ["json", "rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
serde_json = "1.0"
