name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check compilation
        run: cargo check --all-targets

      - name: Run unit tests
        run: cargo test --verbose

      - name: Test npm launcher
        run: node --test npm/tests/launcher.cjs

      - name: Check TUI activity and rendering
        run: |
          cargo build
          python3 tests/tui_activity_pty.py target/debug/takiza
          python3 tests/tui_reasoning_pty.py target/debug/takiza
          python3 tests/tui_clipboard_pty.py target/debug/takiza
          python3 tests/tui_input_pty.py target/debug/takiza
          python3 tests/tui_images_pty.py target/debug/takiza
          python3 tests/tui_questions_pty.py target/debug/takiza
          python3 tests/tui_npm_pty.py target/debug/takiza
          python3 tests/tui_rewind_pty.py target/debug/takiza
          python3 tests/tui_exit_pty.py target/debug/takiza
          python3 tests/tui_terminal_modes_pty.py target/debug/takiza
          python3 tests/tui_file_permission_pty.py target/debug/takiza
          python3 tests/tui_compact_pty.py target/debug/takiza
          python3 tests/tui_mcp_pty.py target/debug/takiza
          python3 tests/tui_output_pty.py target/debug/takiza
          python3 tests/tui_tool_args_pty.py target/debug/takiza
          python3 tests/tui_tool_text_pty.py target/debug/takiza
          python3 tests/tui_code_wrap_pty.py target/debug/takiza
          python3 tests/tui_large_history_pty.py target/debug/takiza
          python3 tests/tui_active_save_pty.py target/debug/takiza
          python3 tests/tui_command_cancel_pty.py target/debug/takiza
          python3 tests/tui_model_context_pty.py target/debug/takiza
          python3 tests/tui_providers_pty.py target/debug/takiza
          python3 tests/tui_context_overflow_pty.py target/debug/takiza
          python3 tests/tui_context_limit_pty.py target/debug/takiza
          python3 tests/tui_output_length_pty.py target/debug/takiza
          python3 tests/tui_execution_modes_pty.py target/debug/takiza
          python3 tests/tui_subagents_pty.py target/debug/takiza
          python3 tests/tui_logo_pty.py target/debug/takiza
          python3 tests/tui_workspace_trust_pty.py target/debug/takiza
          python3 tests/tui_localization_pty.py target/debug/takiza
          python3 tests/tui_hidden_options_pty.py target/debug/takiza
