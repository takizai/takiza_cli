name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for the release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.13'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate versions
        run: |
          python3 - <<'PYTHON'
          import json, os, tomllib
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          assert tomllib.loads(Path('Cargo.toml').read_text())['package']['version'] == version
          assert json.loads(Path('npm/package.json').read_text())['version'] == version
          PYTHON
      - run: cargo test --locked
      - run: node --test npm/tests/launcher.cjs

  create-release:
    needs: validate
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text()
          heading = "## " + version + "\n"
          if heading not in changelog:
              raise SystemExit("Missing changelog entry for " + version)
          notes = changelog.split(heading, 1)[1].split("\n## ", 1)[0].strip()
          Path("release-notes.md").write_text(notes + "\n")
          PYTHON

      - name: Ensure GitHub Release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Checking release for tag: $TAG"
          gh release view "$TAG" || gh release create "$TAG" \
            --draft --verify-tag \
            --title "Release $TAG" \
            --notes-file release-notes.md

  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test Windows profile checkpoint guard
        if: runner.os == 'Windows'
        run: cargo test profile_

      - name: Build and Upload Release Asset
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          locked: true
          bin: takiza
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

  publish:
    name: Publish complete release
    needs: [create-release, upload-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
